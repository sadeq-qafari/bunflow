name: Build standalone executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: bun-linux-x64
            output: flow
          - os: windows-latest
            platform: windows-x64
            target: bun-windows-x64
            output: flow.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install panel dependencies
        working-directory: panel
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install backend dependencies
        working-directory: standalone
        run: bun install --frozen-lockfile

      - name: Run backend tests
        working-directory: standalone
        run: bun test

      - name: Type check backend
        working-directory: standalone
        run: bunx tsc --noEmit

      - name: Build executable
        working-directory: standalone
        run: bun scripts/build.ts --target=${{ matrix.target }}

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: flow-${{ matrix.platform }}
          path: standalone/dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach executables to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform executables
        uses: actions/download-artifact@v4
        with:
          pattern: flow-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
